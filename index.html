<!DOCTYPE html>
<html lang="ceb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>heh. bisaya drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- HOME SCREEN -->
  <div id="home-screen" class="screen active">
    <header class="home-header">
      <div class="wordmark">heh.</div>
      <div class="tagline">bisaya, actually spoken</div>
    </header>

    <main class="home-main">
      <div class="levels-grid" id="levels-grid"></div>
    </main>

    <footer class="home-footer">
      <div class="streak-row" id="streak-row"></div>
    </footer>
  </div>

  <!-- DRILL SCREEN -->
  <div id="drill-screen" class="screen">
    <header class="drill-header">
      <button class="back-btn" id="back-btn" aria-label="Go back to levels">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M11 4L6 9L11 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="drill-level-name" id="drill-level-name"></div>
      <div class="drill-progress-text" id="drill-progress-text"></div>
    </header>

    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <main class="drill-main">
      <div class="chat-thread" id="chat-thread"></div>

      <div class="drill-zone" id="drill-zone">
        <div class="penalty-bar" id="penalty-bar">
          <span id="penalty-msg"></span>
          <div class="penalty-dots" id="penalty-dots"></div>
        </div>

        <div class="phrase-card" id="phrase-card">
          <div class="speaker-label" id="speaker-label"></div>
          <div class="phrase-text" id="phrase-text"></div>
          <div class="phrase-roman" id="phrase-roman"></div>
          <div class="phrase-english" id="phrase-english"></div>
        </div>

        <div class="drill-cue" id="drill-cue">say it out loud, then mark how it felt</div>

        <div class="mark-row">
          <button class="mark-btn mark-smooth" onclick="mark('smooth')" aria-label="Mark as smooth">
            <span class="mark-label">smooth</span>
          </button>
          <button class="mark-btn mark-stumbled" onclick="mark('stumbled')" aria-label="Mark as stumbled">
            <span class="mark-label">stumbled</span>
          </button>
          <button class="mark-btn mark-twisted" onclick="mark('twisted')" aria-label="tongue-twisted">
            <span class="mark-label">twisted</span>
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- COMPLETE SCREEN -->
  <div id="complete-screen" class="screen">
    <main class="complete-main">
      <div class="complete-inner">
        <div class="complete-level-tag" id="complete-level-tag"></div>
        <h1 class="complete-title" id="complete-title"></h1>
        <p class="complete-sub" id="complete-sub"></p>

        <div class="score-grid">
          <div class="score-cell">
            <div class="score-num smooth-col" id="score-smooth">0</div>
            <div class="score-lbl">smooth</div>
          </div>
          <div class="score-cell">
            <div class="score-num stumbled-col" id="score-stumbled">0</div>
            <div class="score-lbl">stumbled</div>
          </div>
          <div class="score-cell">
            <div class="score-num twisted-col" id="score-twisted">0</div>
            <div class="score-lbl">twisted</div>
          </div>
        </div>

        <div class="complete-actions">
          <button class="btn-primary" id="next-level-btn" onclick="goNextLevel()">next level</button>
          <button class="btn-ghost" onclick="retryLevel()">try again</button>
        </div>
      </div>
    </main>
  </div>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
